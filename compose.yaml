# Local PostgreSQL for development and tests. Not used on AWS (RDS there).
# Major version matches RDS (docs/GROUP_ARCHITECTURE.md, D7). Confirm in S3 that
# db.t3.micro offers it; if not, change this tag to the version RDS uses.
# Start with `docker compose up -d --wait`.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: game_library
      # Local-only credential; RDS manages the real password in Secrets Manager.
      POSTGRES_PASSWORD: game_library
      POSTGRES_DB: game_library
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_library -d game_library"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
