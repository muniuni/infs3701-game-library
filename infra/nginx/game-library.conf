# Installed by infra/bootstrap.sh as /etc/nginx/conf.d/game-library.conf.
# @SERVED_BY@ is replaced with "<instance-id> <az>" at boot.
# default_server takes over port 80 from the stock server block in nginx.conf,
# for every Host (ALB DNS name, health checks by IP). The name itself is unused.
server {
    listen 80 default_server;
    server_name game-library;

    # The app enforces 5 MiB per cover plus a bounded multipart envelope.
    client_max_body_size 6m;

    # Which instance served the response (docs/GROUP_ARCHITECTURE.md, D13).
    add_header X-Served-By "@SERVED_BY@" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The ALB terminates HTTPS; pass on its protocol, not ours ($scheme).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Steam enrichment can run long; matches the ALB idle timeout (D5).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
